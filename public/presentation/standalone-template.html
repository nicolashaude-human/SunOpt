<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>SunOpt · Präsentation · Offline HTML5</title>
<style>
:root{color-scheme:light;--bg:#fffaf2;--paper:#fff;--panel:#fff2d8;--ink:#242322;--muted:#66553e;--edge:#d9c7aa;--gold:#ddb114;--green:#2e713f;--shadow:0 6px 22px rgba(50,37,18,.07)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}button{cursor:pointer}#offline-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px clamp(14px,3vw,30px);border-bottom:1px solid var(--edge);background:var(--paper)}#offline-header strong{font-size:23px;letter-spacing:-.04em}#offline-header strong span{color:#b1870f}#offline-header small{font-weight:650;color:var(--muted)}#slide-bar{display:flex;gap:7px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--edge);background:#fff5e4}#slide-tabs{display:flex;flex:1;min-width:0;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}#slide-tabs::-webkit-scrollbar{display:none}.tab,.arrow{border:1px solid var(--edge);border-radius:9px;padding:9px 12px;background:white;color:#675640;font-size:13px;font-weight:750;white-space:nowrap}.tab[aria-current=page]{background:#dcb41f;border-color:#b59018;color:#262117}.arrow{min-width:36px;font-size:18px}button:disabled{opacity:.3;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #42764c;outline-offset:2px}#slide-counter{min-width:54px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}main{height:calc(100dvh - 111px);overflow:auto;padding:clamp(14px,2.5vw,30px)}article.slide{max-width:1530px;margin:auto}.kicker{font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#8c711f;font-size:12px;margin:0 0 6px}.hero{font-size:clamp(29px,3.2vw,52px);letter-spacing:-.045em;line-height:1.06;margin:0 0 10px}.lead{color:var(--muted);max-width:1050px;font-size:clamp(14px,1.35vw,18px);line-height:1.5;margin:0 0 18px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}.metric,.panel{background:var(--paper);border:1px solid var(--edge);border-radius:13px;box-shadow:var(--shadow)}.metric{padding:13px 16px}.metric .name{display:block;color:var(--muted);font-size:12px;font-weight:700}.metric .value{display:block;margin-top:7px;font-size:clamp(18px,1.8vw,29px);font-weight:850;letter-spacing:-.045em}.metric .unit{color:var(--muted);font-size:12px}.panel{padding:16px;margin:14px 0;min-width:0}.panel h2{font-size:clamp(17px,1.65vw,23px);letter-spacing:-.03em;margin:0 0 6px}.note{color:var(--muted);font-size:12px;line-height:1.6}.warn{padding:12px 15px;background:#fff0cb;border-left:4px solid #ba8c00;border-radius:8px;font-size:13px;color:#4b3618}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}.toolbar label{color:var(--muted);font-size:12px;font-weight:700}.toolbar select{display:block;background:white;border:1px solid var(--edge);border-radius:8px;padding:8px 10px;min-width:160px;margin-top:4px}.legend{display:flex;flex-wrap:wrap;gap:6px 15px;margin:8px 0 9px;font-size:12px;color:#594d3c}.legend-item{display:flex;align-items:center;gap:6px;white-space:nowrap}.swatch{display:inline-block;width:18px;height:4px;background:var(--color);border-radius:10px}.chartCanvas{width:100%;height:270px;display:block;border-radius:7px;background:#fff}.chartCaption{font-size:11px;color:var(--muted);margin-top:4px}.svg-figure{width:100%;height:auto;max-height:295px;display:block}.chartGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.flexColumns{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.pieSvg{width:100%;max-height:420px}.titleRow{display:flex;justify-content:space-between;gap:15px;align-items:baseline;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid #eee0c7}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:760}.colorLabel{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}.tag{font-size:11px;font-weight:750;background:#e4efdb;padding:5px 8px;border-radius:30px;color:#295637}.progressbar{height:10px;background:#eee6d8;border-radius:20px;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--gold)}.standalone-footer{padding:18px 0 26px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.solarChart{min-height:290px}.solarWedge{stroke:#fffaf2;stroke-width:2}.featureGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.feature{background:#eff8ec;border:1px solid #84ad83;border-radius:13px;padding:18px}.feature strong{display:block;margin-bottom:7px;color:#204d2a}.feature p{margin:0;color:#4f644e;font-size:13px;line-height:1.5}.smallMuted{color:var(--muted);font-size:13px}.twoCols{display:grid;grid-template-columns:1fr 1fr;gap:14px}#details-section[hidden]{display:none!important}#slide-root .annual-late{font-style:italic;color:var(--muted)}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.flexColumns,.chartGrid,.twoCols{grid-template-columns:1fr}}@media(max-width:600px){#offline-header small{display:none}.cards{grid-template-columns:1fr 1fr}.featureGrid{grid-template-columns:1fr}main{height:calc(100dvh - 106px)}.panel{padding:11px}.tab{padding:8px;font-size:11px}.chartCanvas{height:230px}.toolbar select{min-width:132px}}
@media print{#slide-bar{display:none}main{height:auto;overflow:visible}article.slide{break-after:page}.panel{break-inside:avoid}.slide{max-width:none}}
.time-scroll{display:flex;align-items:center;gap:8px;margin:12px 0}.time-scroll input{width:100%;accent-color:#8c711f}.time-scroll output{display:block;font-size:13px;color:var(--muted)}.time-scroll label{flex:1;min-width:0}.tank-axis{overflow-x:auto}.tank-axis svg{min-width:790px}
.solar-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr);gap:14px;align-items:start}
.solar-wheel,.solar-profile{display:block;width:100%;height:auto}
.solar-label{font-size:18px;font-weight:750;fill:#30291f}
.solar-sub,.solar-tick{font-size:15px;font-weight:650;fill:#66553e}
.solar-leader{fill:none;stroke:#786852;stroke-width:1.4}
.solar-metrics{margin:0}
.solar-metrics div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee0c7;font-size:13px}
.solar-metrics dd{margin:0;white-space:nowrap;font-weight:750}
.solar-energy{display:grid;grid-template-columns:62px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.solar-energy strong{text-align:right}
.solar-split h3{font-size:16px;margin:16px 0 8px}
.solar-split summary{cursor:pointer}
.approach-paths>.panel{margin:0}
.approach-steps{margin:14px 0 0;padding-left:25px}
.approach-steps li{padding-left:4px;margin:0 0 14px}
.approach-steps li:last-child{margin-bottom:0}
.approach-steps li::marker{color:#8c711f;font-weight:750}
.approach-steps h3{font-size:15px;margin:0 0 4px;line-height:1.35}
.approach-steps p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.approach-evidence{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--edge);font-size:13px;line-height:1.5}
.approach-bridge p{margin:7px 0;font-size:14px;line-height:1.5}
.approach-bridge code{overflow-wrap:anywhere}
.tank-heat-input{display:block;width:min(100%,240px);margin-top:5px;padding:8px 10px;border:1px solid var(--edge);border-radius:8px;font:inherit}
.tank-best{border-color:#84ad83;background:#eff8ec}
.tank-best p{margin:5px 0}
@media(max-width:900px){.solar-layout{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header id="offline-header"><strong><span>Sun</span>Opt <small>· Technische Präsentation</small></strong><small>HTML5 · Eigenständig · Keine Netzwerkverbindung nötig</small></header>
<nav id="slide-bar" aria-label="Foliennavigation"><div id="slide-tabs"></div><button class="arrow" id="prev" aria-label="Vorherige Folie">‹</button><output id="slide-counter"></output><button class="arrow" id="next" aria-label="Nächste Folie">›</button></nav>
<main><div id="slide-root" aria-live="polite"></div></main>
<script id="year-snapshot" type="application/json">__SUNOPT_EMBED_SNAPSHOT__</script>
<script id="year-series" type="application/json">__SUNOPT_EMBED_SERIES__</script>
<script id="tank-runs" type="application/json">__SUNOPT_EMBED_TANKS__</script>
<script id="solar-analysis" type="application/json">__SUNOPT_EMBED_SOLAR__</script>
<script>
'use strict';
// Standalone HTML5: This script only renders frozen results. No fetch, no imports,
// no cross-origin requests, no simulation, no dynamic asset URLs.
const snap=JSON.parse(document.getElementById('year-snapshot').textContent);
const detail=JSON.parse(document.getElementById('year-series').textContent);
const tankRuns=JSON.parse(document.getElementById('tank-runs').textContent);
const solar=JSON.parse(document.getElementById('solar-analysis').textContent);
const palette=['#FFB300','#803E75','#FF6800','#A6BDD7','#C10020','#CEA262','#817066','#007D34','#F6768E','#00538A','#FF7A5C','#53377A','#FF8E00','#B32851','#F4C800','#7F180D','#93AA00','#593315','#F13A13','#232C16'];
const models=['existing','quantumGravity','plasmaWave'];
const modelNames={existing:'Existing',quantumGravity:'Quantum Gravity',plasmaWave:'Plasma Wave'};
const monthNames=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const slideTitles=['Verfügbarkeit der Sonne','Jahressimulation','Modellvergleich','Tankvergleich','Ansatz A','Ansatz B','Vom TypeScript-Jahreslauf zur GPU'];
const $=s=>document.querySelector(s); const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,d=1)=>Number(x).toLocaleString('de-CH',{maximumFractionDigits:d,minimumFractionDigits:d});
let current=0,period=-1,modelA='existing',modelB='plasmaWave';
let annualHeatingInput='';
const windowSteps=16*4;
let windowStart=0,periodIndices=[];
function metric(label,value,unit=''){return `<div class="metric"><span class="name">${esc(label)}</span><span class="value">${esc(value)}</span><span class="unit">${esc(unit)}</span></div>`}
function legend(labels){return `<div class="legend">${labels.map(x=>`<span class="legend-item"><i class="swatch" style="--color:${x.color}"></i>${esc(x.name)}</span>`).join('')}</div>`}
function axisChartSvg(values,title,yTitle,labels=monthNames,reference){
  const W=1120,H=274,l=60,r=22,t=20,b=35,plotH=H-t-b,plotW=W-l-r;
  const arr=values.flatMap(v=>v.values).filter(Number.isFinite),max=Math.max(1,reference??0,...arr)*1.12,min=Math.min(0,...arr)*1.12;
  const y=n=>t+(max-n)/(max-min)*plotH;
  const slot=plotW/labels.length,barWidth=slot*.8/values.length;
  let out=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" class="svg-figure" role="img" aria-label="${esc(title)}">`;
  for(let k=0;k<5;k++){const value=min+(max-min)*k/4,yy=y(value);out+=`<line x1="${l}" y1="${yy}" x2="${W-r}" y2="${yy}" stroke="#e8ddca"/><text x="${l-8}" y="${yy+4}" text-anchor="end" fill="#685b48" font-size="12">${num(value,max-min<10?1:0)}</text>`}
  values.forEach((v,idx)=>{v.values.forEach((n,i)=>{if(!Number.isFinite(n))return;const x=l+(i+.10)*slot+idx*barWidth;out+=`<rect x="${x}" y="${Math.min(y(n),y(0))}" width="${barWidth*.88}" height="${Math.abs(y(0)-y(n))}" rx="2" fill="${v.color}"><title>${esc(v.name)} · ${esc(labels[i])}: ${num(n,2)} ${esc(yTitle)}</title></rect>`})});
  labels.forEach((label,i)=>out+=`<text x="${l+(i+.5)*slot}" y="${H-9}" font-size="12" text-anchor="middle" fill="#655540">${esc(label)}</text>`);
  if(reference!==undefined)out+=`<line class="tank-thermal-reference" x1="${l}" x2="${W-r}" y1="${y(reference)}" y2="${y(reference)}" stroke="#00538a" stroke-width="2" stroke-dasharray="6 4"><title>${num(reference)} ${esc(yTitle)}</title></line>`;
  return out+'</svg>';
}
function renderSolarWheel(){
 const seasonal=solar.seasonalPercent/2;
 const weak=solar.weakPercent/2;
 const slices=[
  ['Saisonal · Morgen','Im Winter ohne PV',seasonal,'#817066',124,183,204,214],
  ['Regen / Bewölkung','Schwache Einstrahlung',weak,'#6e8798',139,88,205,113],
  ['Produktives Sonnenfenster','',solar.productivePercent,'#ddb114',410,39,410,69],
  ['Regen / Bewölkung','Schwache Einstrahlung',weak,'#6e8798',681,88,615,113],
  ['Saisonal · Abend','Im Winter ohne PV',seasonal,'#817066',696,183,616,214],
  ['Nacht','0 Sonne',solar.nightPercent,'#222222',410,537,410,514],
 ];
 const cx=410,cy=268,radius=180;
 const point=(degrees,r=radius)=>{
  const angle=degrees*Math.PI/180;
  return [cx+r*Math.sin(angle),cy-r*Math.cos(angle)];
 };
 let start=270;
 const wedges=[],labels=[];
 for(const [label,description,share,color,x,y,anchorX,anchorY] of slices){
  const end=start+share*3.6;
  if(share>0){
   const mid=(start+end)/2;
   wedges.push(`<path d="M ${cx} ${cy} L ${point(start).join(' ')} A ${radius} ${radius} 0 0 1 ${point(end).join(' ')} Z" fill="${color}" class="solarWedge"/>`);
   labels.push(`<polyline points="${point(mid).join(',')} ${point(mid,radius+18).join(',')} ${anchorX},${anchorY}" class="solar-leader"/>
   <text class="solar-label" x="${x}" y="${y}" text-anchor="middle">${label}<tspan class="solar-sub" x="${x}" dy="21">${description?description+' · ':''}${num(share)} %</tspan></text>`);
  }
  start=end;
 }
 const clock=[[410,113,'12:00'],[198,273,'06:00'],[622,273,'18:00'],[410,432,'00:00']]
  .map(([x,y,label])=>`<text class="solar-tick" x="${x}" y="${y}" text-anchor="middle"${label==='00:00'?' style="fill:white"':''}>${label}</text>`).join('');
 return `<svg class="solar-wheel" viewBox="0 0 820 573" role="img" aria-label="24-h-Kreis mit Nacht, saisonalen Anteilen, schwacher Einstrahlung und produktivem Sonnenfenster">
 ${wedges.join('')}${labels.join('')}${clock}</svg>`;
}

function renderSolarProfile(profiles){
 const left=70,top=24,width=898,height=248,bottom=top+height;
 const max=Math.ceil(Math.max(100,...profiles.flatMap(profile=>profile.values))*1.05/100)*100;
 const x=hour=>left+hour/24*width;
 const y=value=>bottom-value/max*height;
 const ticks=Array.from({length:max/100+1},(_,i)=>i*100);
 const grid=ticks.map(value=>`<line x1="${left}" x2="${x(24)}" y1="${y(value)}" y2="${y(value)}" stroke="#e8ddca"/><text class="solar-tick" x="${left-8}" y="${y(value)+5}" text-anchor="end">${value} %</text>`).join('');
 const hours=[0,6,solar.coreStart,12,solar.coreEnd,18,24].map(hour=>`<text class="solar-tick" x="${x(hour)}" y="${bottom+23}" text-anchor="middle">${String(hour).padStart(2,'0')}:00</text>`).join('');
 const curves=profiles.map(({name,values,color})=>{
  const points=[...values,values[0]].map((value,hour)=>`${x(hour)},${y(value)}`).join(' ');
  return `<polyline class="solar-season-curve" points="${points}" fill="none" stroke="${color}" stroke-width="3"><title>${esc(name)}</title></polyline>`;
 }).join('');
 return `<svg class="solar-profile" viewBox="0 0 1000 315" role="img" aria-label="PV-Tagesprofile für regenfreie Tage im Sommer- und Winterhalbjahr. Das Jahresmittel entspricht 100 Prozent.">
 ${grid}${hours}
 <line x1="${left}" x2="${x(24)}" y1="${y(100)}" y2="${y(100)}" stroke="#786852" stroke-dasharray="5 5"/>
 ${curves}
 </svg>`;
}

function renderSolar(){
 const {source}=solar;
 const profiles=[
  ['summer','Sommerhalbjahr (Apr–Sep)','#b44b20'],
  ['winter','Winterhalbjahr (Okt–Mär)','#71396d'],
 ].map(([season,label,color])=>{
  const {dryDays,totalDays,values}=solar.dryDayProfiles[season];
  return {name:`${label} · ${dryDays} von ${totalDays} Tagen`,color,values};
 });
 const metrics=[
  [`Nacht · ${solar.nightHours} h`,solar.nightPercent],
  [`Saisonal verschoben · ${solar.seasonalHours} h`,solar.seasonalPercent],
  ['Davon Morgen',solar.seasonalPercent/2],['Davon Abend',solar.seasonalPercent/2],
  ['Schwache Einstrahlung',solar.weakPercent],['Produktives Sonnenfenster',solar.productivePercent],
 ];
 const energy=[
  ['Apr–Sep',solar.summerPercent,'#ae8505'],['Okt–Mär',solar.winterPercent,'#817066'],
 ];
 return `<article class="slide">
  <p class="kicker">Folie 1 · Ausgangslage</p><h1 class="hero">Wann ist Solarenergie wirklich verfügbar?</h1>
  <p class="lead">Der 24-Stunden-Kreis setzt ${solar.nightHours} h Nacht und ${solar.seasonalHours} h saisonal verschobenes Tageslicht an. Die Aufteilung des Mittagsfensters sowie die Energieanteile und das Tagesprofil stammen aus den PVGIS-Stundenwerten.</p>
  <p class="note">PVGIS · PLZ ${esc(source.postalCode)} · ${esc(source.year)} · ${num(source.peakPower,0)} kWp · Azimut ${num(source.azimuth,0)}° · Neigung ${num(source.inclination,0)}° · ${num(100*source.systemLoss,0)} % Verluste · ${num(solar.pointCount,0)} Stundenwerte · UTC</p>
  <div class="solar-layout">
   <section class="panel"><h2>Zeitliche Verfügbarkeit im 24-Stunden-Kreis</h2>${renderSolarWheel()}</section>
   <aside class="panel solar-split">
    <h2>Aufteilung der 24 Stunden</h2>
    <dl class="solar-metrics">${metrics.map(([label,value])=>`<div><dt>${label}</dt><dd>${num(value)} %</dd></div>`).join('')}</dl>
    <h3>PV-Ertrag nach Halbjahr</h3>
    ${energy.map(([label,share,color])=>`<div class="solar-energy"><span>${label}</span><div class="progressbar"><span style="width:${share}%;background:${color}"></span></div><strong>${num(share)} %</strong></div>`).join('')}
    <p class="note">${num(solar.summerEnergy,0)} kWh im Sommerhalbjahr, ${num(solar.winterEnergy,0)} kWh im Winterhalbjahr.</p>
    <details class="note"><summary>Klassifikation</summary><p>Für die Einteilung im Kreisdiagramm zählen PV-Werte unter ${num(solar.thresholdPower,2)} kW zwischen ${solar.coreStart}:00 und ${solar.coreEnd}:00 UTC als schwache Einstrahlung.</p></details>
   </aside>
  </div>
  <section class="panel">
   <h2>PV-Tagesprofile an regenfreien Tagen</h2>
   ${legend(profiles)}
   ${renderSolarProfile(profiles)}
   <p class="note">Die Kurven mitteln die PV-Leistung pro Uhrzeit für Tage mit 0 mm Regen laut ${esc(solar.rainSource)}. Die gestrichelte Linie bei 100 % entspricht dem Mittel über das ganze Jahr (${num(solar.annualMeanPower,2)} kW). Der höchste PVGIS-Stundenwert im Jahr ${esc(source.year)} beträgt ${num(solar.maximumPower,2)} kW.</p>
  </section>
 </article>`;
}
function renderYear(){
 const p=snap.parameters,s=snap.source,a=snap.annual;
 const rows=models.map((m,i)=>`<tr><td><span class="colorLabel" style="background:${palette[i]}"></span>${modelNames[m]}</td><td>${num(a[m].gridImportEnergy,2)}</td><td>${num(a[m].pvUsedByHeatPumpEnergy,2)}</td><td>${num(a[m].heatPumpEnergy,2)}</td><td>${num(a[m].storageLossEnergy,2)}</td><td>${num(a[m].temperatureSum/a[m].temperatureSamples,2)}</td></tr>`).join('');
 const noSeries=!detail||!Array.isArray(detail.rows)||detail.rows.length!==s.dataPoints;
 return `<article class="slide"><p class="kicker">Folie 2 · Jahressimulation · einmalig berechnet</p><div class="titleRow"><h1 class="hero">Jahressimulation ${esc(s.year)}</h1><span class="tag">${noSeries?'Monatsdaten eingebettet':'35\u2019040 Viertelstundenwerte eingebettet'}</span></div><p class="lead">PLZ ${esc(p.postalCode)} · ${num(p.pvSystem.peakPower,0)} kWp PV · ${num(p.heatPump.thermalPower,0)} kW<sub>th</sub> Wärmepumpe · ${num(p.storage.volume,0)} l Speicher · ${esc(s.dataPoints)} × 15 Minuten · Existing / Quantum Gravity / Plasma Wave.</p>
 <div class="cards">${metric('Netzbezug · Existing',num(a.existing.gridImportEnergy,2),'kWh el.')}${metric('Netzbezug · Plasma Wave',num(a.plasmaWave.gridImportEnergy,2),'kWh el.')}${metric('PV → WP · Plasma Wave',num(a.plasmaWave.pvUsedByHeatPumpEnergy,2),'kWh el.')}${metric('Historische Rechendauer',num(s.simulationDurationMs/1000,3),'s · bei Erfassung')}</div>

 };

 if(!Number.isFinite(lo)){ctx.fillStyle='#655540';ctx.fillText('Keine Werte in diesem Zeitraum.',l+12,35);return}
 lo=Math.min(0,lo);hi=Math.max(hi,lo+0.01);const pad=(hi-lo)*.07;lo-=pad;hi+=pad;
 const y=value=>t+(hi-value)/(hi-lo)*H;
 ctx.font='12px system-ui';ctx.strokeStyle='#eee6db';ctx.lineWidth=1;ctx.textAlign='right';ctx.fillStyle='#76654d';
 for(let k=0;k<5;k++){const yy=t+k*H/4;ctx.beginPath();ctx.moveTo(l,yy);ctx.lineTo(l+W,yy);ctx.stroke();ctx.fillText(num(hi-k*(hi-lo)/4,1),l-6,yy+4)}
 const m=idx.length;for(let k=0;k<=4;k++){const i=idx[Math.round(k*(m-1)/4)];ctx.textAlign=k===0?'left':k===4?'right':'center';ctx.fillText(detail.timestamps[i].slice(11,16),l+k*W/4,cssH-10)}
 ctx.save();ctx.beginPath();ctx.rect(l,t,W,H);ctx.clip();
 const buckets=Math.max(1,Math.floor(W));
 for(const s of series){ctx.strokeStyle=s.color;ctx.lineWidth=s.thick||1.6;ctx.setLineDash(s.dash||[]);ctx.beginPath();let started=false,previousY=0;
 if(m<=buckets*2){for(let j=0;j<m;j++){const v=rows[idx[j]][s.ci];if(!Number.isFinite(v)){started=false;continue}const x=l+(j/Math.max(1,m-1))*W,yy=y(v);if(!started){ctx.moveTo(x,yy);started=true}else{if(s.step)ctx.lineTo(x,previousY);ctx.lineTo(x,yy)}previousY=yy}}
 else{for(let bkt=0;bkt<buckets;bkt++){const a=Math.floor(bkt*m/buckets),end=Math.min(m,Math.floor((bkt+1)*m/buckets));let min=Infinity,max=-Infinity;for(let j=a;j<end;j++){const v=rows[idx[j]][s.ci];if(Number.isFinite(v)){min=Math.min(min,v);max=Math.max(max,v)}}if(!Number.isFinite(min))continue;const x=l+bkt;ctx.moveTo(x,y(min));ctx.lineTo(x,y(max));}}
 ctx.stroke()}
 ctx.restore();ctx.setLineDash([]);
}
function updatePlots(){if(!detail||current!==1)return;
 const color={e:palette[0],q:palette[1],p:palette[2],hp:palette[3],storage:palette[4],pv:palette[7],required:palette[5],before:palette[8],after:palette[9],heat:palette[12],water:palette[14]};
 const spec1=[{key:'existing.controlSignal',name:'Existing control',color:color.e,step:true},{key:'quantumGravity.controlSignal',name:'Quantum Gravity control',color:color.q,step:true},{key:'plasmaWave.controlSignal',name:'Plasma Wave control',color:color.p,step:true},{key:'required48hEnergy',name:'48 h required energy',color:color.required,thick:2.5,step:true}];
 for(const m of [modelA,...(modelB==='na'||modelB===modelA?[]:[modelB])])spec1.push({key:m+'.heatPumpEnergy',name:modelNames[m]+' – HP energy',color:color.hp,step:true,dash:m===modelA?[]:[6,3]},{key:m+'.storageEnergy',name:modelNames[m]+' – storage energy',color:color.storage,step:true,dash:m===modelA?[]:[6,3]},{key:m+'.pvEnergy',name:modelNames[m]+' – PV energy',color:color.pv,step:true,dash:m===modelA?[]:[6,3]});
 renderPlot('plot-control','legend-control',spec1,'kWh');
 renderPlot('plot-temperature','legend-temperature',[{key:modelA+'.storageTemperature',name:modelNames[modelA],color:palette[0],thick:2.5},...(modelB!=='na'&&modelB!==modelA?[{key:modelB+'.storageTemperature',name:modelNames[modelB],color:palette[1],dash:[6,3],thick:2.5}]:[])],'°C');
 const spec3=[];for(const m of [modelA,...(modelB==='na'||modelB===modelA?[]:[modelB])])spec3.push({key:m+'.exportBeforeHpPower',name:modelNames[m]+' – Export vor WP',color:color.before,dash:m===modelA?[]:[6,3]},{key:m+'.exportAfterHpPower',name:modelNames[m]+' – Export nach WP',color:color.after,dash:m===modelA?[]:[6,3]},{key:m+'.heatPumpElectricalPower',name:modelNames[m]+' – WP el. Leistung',color:color.heat,step:true,dash:m===modelA?[]:[6,3],thick:2.5});
 if(modelA==='plasmaWave'||modelB==='plasmaWave')spec3.push({key:'userForecastWaterlinePower',name:'kWh_user · 48 h',color:color.water,step:true},{key:'noSunshineWaterlinePower',name:'kWh_noSunshine · 7 d',color:palette[4],dash:[7,3],step:true},{key:'effectiveWaterlinePower',name:'Effective Waterline',color:palette[7],thick:2.8,step:true},{key:'combinedPlannedHpTopPower',name:'HP top',color:palette[9],dash:[4,3],step:true});
 renderPlot('plot-scheduling','legend-scheduling',spec3,'kW el.');
}
const renderSlides=[renderSolar,renderYear,renderCompare,renderTanks,()=>renderApproach('A'),()=>renderApproach('B'),renderPerformance];
function goto(index){
 current=Math.max(0,Math.min(slideTitles.length-1,index));
 $('#slide-tabs').innerHTML=slideTitles.map((name,i)=>`<button class="tab" data-slide="${i}" aria-current="${i===current?'page':'false'}">${i+1}. ${esc(name)}</button>`).join('');
 $('#slide-counter').textContent=`${current+1} / ${slideTitles.length}`;
 $('#prev').disabled=current===0;
 $('#next').disabled=current===slideTitles.length-1;
 $('#slide-root').innerHTML=renderSlides[current]();
 $('main').scrollTop=0;
 document.querySelectorAll('button[data-slide]').forEach(button=>button.onclick=()=>goto(Number(button.dataset.slide)));
 $('.tab[aria-current="page"]').scrollIntoView({block:'nearest',inline:'nearest'});
 if(current===1&&$('#time-range')&&!$('#details-section').hidden)setupTimeScroll();
 const heatingInput=$('#tank-annual-heating');
 if(heatingInput)heatingInput.oninput=()=>{
  annualHeatingInput=heatingInput.value;
  $('#tank-thermal-chart').innerHTML=renderThermalReserveChart(tankRuns.B??tankRuns.A);
 };
}
$('#prev').onclick=()=>goto(current-1);
$('#next').onclick=()=>goto(current+1);
document.addEventListener('keydown',event=>{
 if(event.target.closest('select,input,textarea,.tank-axis'))return;
 if(event.key==='ArrowRight')goto(current+1);
 if(event.key==='ArrowLeft')goto(current-1);
});
window.addEventListener('resize',updatePlots);
goto(parseInt(new URLSearchParams(location.search).get('slide')??'0',10)||0);
</script>
